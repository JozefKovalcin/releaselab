apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: releaselab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/REPLACE_ME/releaselab.git
    targetRevision: main
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: releaselab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 1m }
