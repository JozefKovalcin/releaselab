apiVersion: apps/v1
kind: Deployment
metadata:
  name: releaselab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: releaselab }
  template:
    metadata:
      labels: { app: releaselab }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: release-demo:bootstrap
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: RELEASELAB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: releaselab-api
                  key: api_key
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
